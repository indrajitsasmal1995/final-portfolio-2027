<!doctype html>
<html lang="en">
<head>
<base href="/motion-bucket/">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Bucket</title>
  <meta name="description" content="A field guide to native mobile motion. 76 iOS and Android interactions with live previews, tunable springs and curves, and ready-to-paste code.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23FF5A1F'/%3E%3Cstop offset='1' stop-color='%23FF2D87'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9.5 24 C7 19 6.8 9 11.6 8.4 C14.4 8 17 10.6 17.9 12.6 C18.8 14.8 17.6 16.6 16 16.6 C14.4 16.6 13.2 14.8 14.1 12.6 C15 10.6 17.6 8 20.4 8.4 C25.2 9 25 19 22.5 24' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400;500&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>
  <div class="app">
    <aside class="index" id="index" aria-label="Interaction index">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FF2D87"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#markGrad)"/><path d="M9.5 24 C7 19 6.8 9 11.6 8.4 C14.4 8 17 10.6 17.9 12.6 C18.8 14.8 17.6 16.6 16 16.6 C14.4 16.6 13.2 14.8 14.1 12.6 C15 10.6 17.6 8 20.4 8.4 C25.2 9 25 19 22.5 24"/></svg>
        <div class="brand-text">
          <div class="brand-name">Motion Bucket</div>
          <div class="brand-sub" id="brandSub">A field guide to native motion</div>
        </div>
        <button class="icon-btn only-narrow" id="closeIndex" aria-label="Close index">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find an interaction" autocomplete="off" spellcheck="false" aria-label="Find an interaction">
        <kbd>/</kbd>
      </label>
      <div class="list-tools"><span id="listCount"></span><button class="text-btn" id="foldAll" type="button">Collapse all</button></div>
      <nav class="list" id="list"></nav>
      <div class="index-foot">
        <div class="keys">
          <span><kbd>↑</kbd><kbd>↓</kbd> browse</span>
          <span><kbd>R</kbd> replay</span>
          <span><kbd>P</kbd> platform</span>
          <span><kbd>T</kbd> try it</span>
        </div>
        <button class="text-btn" id="theme">Theme · Auto</button>
      </div>
    </aside>
    <div class="index-scrim" id="indexScrim"></div>

    <main class="stage">
      <header class="stage-head">
        <button class="icon-btn only-narrow" id="openIndex" aria-label="Open the index" title="Index">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="crumb" id="crumb"></div>
        <div class="step">
          <button class="icon-btn" id="prev" aria-label="Previous interaction"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 6l-6 6 6 6"/></svg></button>
          <button class="icon-btn" id="next" aria-label="Next interaction"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 6l6 6-6 6"/></svg></button>
        </div>
      </header>

      <div class="title-block">
        <h1 id="title"></h1>
        <p id="summary"></p>
      </div>

      <div class="variants" id="variants" role="tablist" aria-label="Variants"></div>

      <div class="bench" id="bench">
        <div class="device-wrap" id="deviceWrap">
          <div class="device os-ios" id="device">
            <div class="screen" id="screen">
              <div class="scr" id="scr"></div>
              <div class="status" id="status">
                <span class="st-time" id="stTime">9:41</span>
                <span class="st-cam"></span>
                <span class="st-icons">
                  <svg viewBox="0 0 18 12" width="17" height="11"><rect x="0" y="8" width="3" height="4" rx="0.7"/><rect x="5" y="5.5" width="3" height="6.5" rx="0.7"/><rect x="10" y="3" width="3" height="9" rx="0.7"/><rect x="15" y="0" width="3" height="12" rx="0.7"/></svg>
                  <svg viewBox="0 0 24 24" width="15" height="15" class="st-wifi"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M2 9a14 14 0 0 1 20 0"/><circle cx="12" cy="19.5" r="1.3"/></svg>
                  <span class="st-batt"><i></i></span>
                </span>
              </div>
              <div class="touch" id="touch"></div>
              <div class="homebar"></div>
            </div>
          </div>
          <div class="device-label" id="deviceLabel"></div>
        </div>
        <div class="try-hint" id="tryHint" aria-live="polite"></div>
      </div>

      <div class="controls">
        <div class="seg" id="osSeg" role="radiogroup" aria-label="Platform">
          <button data-os="ios" role="radio">iOS</button>
          <button data-os="android" role="radio">Android</button>
        </div>
        <div class="seg" id="modeSeg" role="radiogroup" aria-label="Mode">
          <button data-mode="demo" role="radio">Watch</button>
          <button data-mode="try" role="radio">Try it</button>
        </div>
        <div class="ctl-group">
          <div class="seg small" id="speedSeg" role="radiogroup" aria-label="Speed">
            <button data-speed="1" role="radio">1×</button>
            <button data-speed="0.5" role="radio">½×</button>
            <button data-speed="0.2" role="radio">⅕×</button>
          </div>
          <button class="ctl toggle" id="loop" aria-pressed="true" title="Loop (L)">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/></svg>Loop
          </button>
          <button class="ctl" id="replay">
            <svg viewBox="0 0 24 24" width="15" height="15"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Replay
          </button>
        </div>
      </div>
    </main>

    <section class="spec" id="spec" aria-label="Specification">
      <div class="spec-sec">
        <div class="sec-label"><span class="si"><svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M18.5 15.5l.6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6z"/></svg></span>Character</div>
        <div class="char">
          <div class="feel">
            <div class="feel-word" id="feelWord"></div>
            <span class="tuned-chip" id="tunedChip" hidden>Tuned</span>
          </div>
          <dl class="facts">
            <div><dt>Type</dt><dd id="fType"></dd></div>
            <div><dt>Duration</dt><dd id="fDur"></dd></div>
            <div><dt>Animates</dt><dd id="fProp"></dd></div>
            <div><dt>Platform</dt><dd id="fOs"></dd></div>
          </dl>
        </div>
      </div>

      <div class="spec-sec">
        <div class="sec-label"><span class="si"><svg viewBox="0 0 24 24"><path d="M3 19C10 19 11 5 21 5"/></svg></span>Curve<em>drag to scrub</em></div>
        <div class="plot" id="plot"></div>
        <div class="readout"><span id="rT">0 ms</span><span id="rV">progress 0%</span></div>
      </div>

      <div class="spec-sec">
        <div class="sec-label"><span class="si"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.5"/><circle cx="10" cy="17" r="2.5"/></svg></span>Tune<button class="reset-btn" id="reset" type="button" disabled title="Reset to the default motion"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Reset</button></div>
        <div class="tune-status" id="tuneStatus">
          <span class="ts-text" id="tsText">Platform default</span>
        </div>
        <div class="seg small wide" id="typeSeg" role="radiogroup" aria-label="Motion type">
          <button data-type="spring" role="radio">Spring</button>
          <button data-type="tween" role="radio">Curve</button>
        </div>
        <div id="tuneFields" class="tune"></div>
        <div class="derived" id="derived"></div>
      </div>

      <div class="spec-sec last">
        <div class="sec-label"><span class="si"><svg viewBox="0 0 24 24"><path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg></span>Build</div>
        <div class="code-note" id="codeNote" hidden>
          <span>This code uses your tuned values.</span>
          <button class="reset-btn" id="resetCode" type="button"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg>Reset</button>
        </div>
        <div class="api"><div class="api-k" id="apiK">Native API</div><code id="api"></code></div>
        <div class="code-tabs" id="codeTabs" role="tablist"></div>
        <div class="code">
          <button class="copy" id="copy">Copy</button>
          <pre><code id="code"></code></pre>
        </div>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
